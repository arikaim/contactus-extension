{% set send_email_notifications = getOption('contactus.notifications.email.send') %}
{% set email = getOption('contactus.notifications.email') %}
{% component 'system:admin.panel' %}
    <div class="mt-4">            
        <form 
            class="form" 
            id="notifications_settings_form">            
            <div class="{{ theme.form.field }}">                                     
                <input 
                    type="checkbox" 
                    name="send_email_notifications" 
                    id="send_email_notifications_checkbox" 
                    tabindex="0" 
                    {{ send_email_notifications|ifthen(true,'checked') }}>
                <label class="{{ theme.form.checkbox_label }}">
                    {{ labels.fields.email }}
                </label>               
            </div>
            <div 
                class="{{ theme.form.field }} {{ send_email_notifications|ifthen(false,'disabled') }}" 
                id="email_field">                                       
                <input 
                    class="{{ theme.form.checkbox }}"
                    type="text" 
                    name="notification_email" 
                    id="notification_email" 
                    tabindex="0" 
                    value="{{ email }}">   
                <label class="{{ theme.form.checkbox_label }}">
                    {{ labels.email }}
                </label>                            
            </div>             
            {{ component('system:form.footer') }}            
        </form>
    </div>
{% endcomponent %}
