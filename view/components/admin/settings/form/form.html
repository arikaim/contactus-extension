{% set settings = service('options').get('contactus.form.settings') %}
{% set send_message = service('options').get('contactus.send.message',message) %}

{% component 'system:admin.panel' %}
    {% set size = 'w-1/3' %}
    <div class="form mt-4" 
        id="settings_form">  
        <div class="{{ theme.form.field }}">
            <label class="{{ theme.form.label }}">
                {{ labels.name }}
            </label>
            <input 
                type="checkbox" 
                name="show_name" 
                id="show_name" 
                tabindex="0" 
                class="{{ theme.form.checkbox }}" 
                {{ settings.name.show|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.show }}
            </label>
    
            <input 
                type="checkbox" 
                name="require_name" 
                id="require_name" 
                tabindex="0" 
                class="ml-4 {{ theme.form.checkbox }}" 
                {{ settings.name.required|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.required }}
            </label>
        </div>

        <div class="{{ theme.form.field }}">
            <label class="{{ theme.form.label }}">
                {{ labels.email }}
            </label>
            <input 
                type="checkbox" 
                name="show_email" 
                id="show_email" 
                tabindex="0" 
                class="{{ theme.form.checkbox }}" 
                {{ settings.email.show|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.show }}
            </label>
            <input 
                type="checkbox" 
                name="require_email" 
                id="require_email" 
                tabindex="0" 
                class="ml-4 {{ theme.form.checkbox }}" 
                {{ settings.email.required|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.required }}
            </label>           
        </div>

        <div class="{{ theme.form.field }}">
            <label class="{{ theme.form.label }}">
                {{ labels.phone }}
            </label>
            <input 
                type="checkbox" 
                name="show_phone" 
                id="show_phone" 
                tabindex="0" 
                class="{{ theme.form.checkbox }}" 
                {{ settings.phone.show|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.show }}
            </label>
        
            <input 
                type="checkbox" 
                name="require_phone" 
                id="require_phone" 
                tabindex="0" 
                class="ml-4 {{ theme.form.checkbox }}" 
                {{ settings.phone.required|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.required }}
            </label>
        </div>

        <div class="{{ theme.form.field }}">
            <label class="{{ theme.form.label }}">
                {{ labels.subject }}
            </label>
            <input 
                type="checkbox" 
                name="show_subject" 
                id="show_subject" 
                tabindex="0" 
                class="{{ theme.form.checkbox }}" 
                {{ settings.subject.show|ifthen(true,'checked') }} >
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.show }}
            </label>
            
            <input 
                type="checkbox" 
                name="require_subject" 
                id="require_subject" 
                tabindex="0" 
                class="ml-4 {{ theme.form.checkbox }}" 
                {{ settings.subject.required|ifthen(true,'checked') }}>
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.required }}
            </label>            
        </div>         
      
        <div class="{{ theme.form.field }}">
            <label class="{{ theme.form.label }}">
                {{ labels.captcha }}
            </label>
            
            <input 
                type="checkbox" 
                name="show_captcha" 
                id="show_captcha" 
                tabindex="0" 
                class="{{ theme.form.checkbox }}" 
                {{ settings.captcha.show|ifthen(true,'checked') }}>
            <label class="{{ theme.form.checkbox_label }}">
                {{ labels.protect }}
            </label>           
        </div>     
    </div>
{% endcomponent %}
